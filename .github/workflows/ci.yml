name: Verify
on:
  push:
    branches: [main, 'rebuild/veyra-v5-clean-slate']
  pull_request:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run lint
      - run: npm run secrets:check
      - run: npx playwright install --with-deps chromium
        if: false # Superseded V4 browser suite
      - run: npm run test:browser
        if: false # Superseded V4 browser suite
      - run: npx playwright install --with-deps chromium
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.ref == 'refs/heads/rebuild/veyra-v5-clean-slate'
      - run: |
          mkdir -p test-results
          npx playwright test --project=v5 --reporter=json > "$RUNNER_TEMP/v5-results.json" || true
          cp "$RUNNER_TEMP/v5-results.json" test-results/v5-results.json
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.ref == 'refs/heads/rebuild/veyra-v5-clean-slate'
      - run: node scripts/stage0-browser-baseline.js test-results/v5-results.json
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.ref == 'refs/heads/rebuild/veyra-v5-clean-slate'
      - name: Stage 2.2 strict profile browser gate
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feat/stage2-2') || startsWith(github.head_ref, 'fix/profile-'))
        run: node scripts/stage2-2-browser-gate.js test-results/v5-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: test-results/
          retention-days: 7
