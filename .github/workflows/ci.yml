name: Verify
on:
  push:
    branches: [main, 'rebuild/veyra-v5-clean-slate']
  pull_request:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run secrets:check
      - run: npx playwright install --with-deps chromium
        if: github.head_ref != 'rebuild/veyra-v5-clean-slate' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
      - run: npm run test:browser
        if: github.head_ref != 'rebuild/veyra-v5-clean-slate' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: test-results/
          retention-days: 7
